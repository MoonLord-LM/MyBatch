name: self-check

on:
  schedule:
    - cron: '57 23 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['**/*.bat', '**/*.ps1', 'self-check.bat', '.github/workflows/self-check.yml']
  pull_request:
    branches: [master]
    paths: ['**/*.bat', '**/*.ps1', 'self-check.bat', '.github/workflows/self-check.yml']

permissions:
  contents: write

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  self-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run self-check.bat
        shell: cmd
        run: call self-check.bat <nul

      - name: Commit and push
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          git config --local core.autocrlf false
          git config --local core.safecrlf false
          git config --local core.ignorecase false
          git config --local core.quotepath false
          git config --local i18n.logoutputencoding utf-8
          git config --local i18n.commitencoding utf-8
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto-fix by [ self-check.bat ]"
            git pull origin master
            git push origin HEAD
          } else {
            Write-Host 'No changes after self-check.'
          }
